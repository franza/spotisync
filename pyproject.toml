[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "spotisync"
version = "2.0.0"
description = "Copy Spotify playlists to TIDAL, matching tracks by ISRC"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31,<3",
    "python-dotenv>=1.0,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
spotisync = "spotisync.cli:main"

[tool.setuptools]
packages = ["spotisync"]

[tool.pytest.ini_options]
testpaths = ["tests"]
